<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Space Mono</string>
        </patelt>
        <patelt name="slant">
          <const>italic</const>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>
  <alias binding="same">
    <family>Space Mono</family>
    <accept>
      <family>JetBrainsMono Nerd Font</family>
    </accept>
  </alias>
</fontconfig>
